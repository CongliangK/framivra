name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No GPU required. Model/Blender/external-service tests remain optional in the
# ordinary runner; the two enumerated media jobs below prohibit all skips.
env:
  VTX_DOCTOR_OFFLINE: '1'
  VTX_SAFETY_EXPECT_FIXED: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  core:
    name: Core Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Declared classifiers in pyproject.toml, including the >=3.9 floor.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real CPU tools used by core fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install test-only dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<13' 'jsonschema>=4.18,<5' 'PyYAML>=6,<7' 'requests>=2.31,<3'
      - name: Run kernel, app, plugin and example unittest batches
        run: |
          export HOME="$RUNNER_TEMP/framivra-core-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export VTX_CONFIG="$HOME/config.json"
          mkdir -p "$XDG_CONFIG_HOME"
          printf '{}\n' > "$VTX_CONFIG"
          unset PYTHONPATH PYTHONHOME BGM_CLI BGM_REPO IMGEN_CONFIG SC_API_KEY NANOBANANA2_API_KEY
          bash scripts/run_all_tests.sh

  contracts:
    name: Documentation and static syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check Python, Bash and Node syntax without executing source
        run: python scripts/ci_checks.py static
      - name: Run all documentation gates
        run: bash scripts/doc_gates.sh

  ffmpeg:
    name: FFmpeg CPU integration (no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install CPU media and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<13'
      - name: Preflight tools and execute declared FFmpeg integrations
        run: python scripts/ci_checks.py ffmpeg

  chrome:
    name: Chrome and pipeline CPU integration (no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install media and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<13'
      # ubuntu-24.04 hosted images provide google-chrome. The strict preflight
      # actually launches it: image changes/missing Chrome fail, never skip.
      - name: Preflight Chrome and execute graphics and cold/warm pipeline
        run: python scripts/ci_checks.py chrome
