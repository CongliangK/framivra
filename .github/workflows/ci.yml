name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Smoke only: no real media, full discovery or intermediate Python versions.
# Integration regression runs those checks on schedule or workflow_dispatch.
env:
  VTX_DOCTOR_OFFLINE: '1'
  VTX_SAFETY_EXPECT_FIXED: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  core:
    name: Core Python ${{ matrix.python }} (stdlib smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library smoke (reduced coverage, zero skips)
        run: |
          export HOME="$RUNNER_TEMP/framivra-core-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export VTX_CONFIG="$HOME/config.json"
          mkdir -p "$XDG_CONFIG_HOME"
          printf '{}\n' > "$VTX_CONFIG"
          unset PYTHONPATH PYTHONHOME BGM_CLI BGM_REPO IMGEN_CONFIG SC_API_KEY NANOBANANA2_API_KEY
          echo 'Standard-library smoke only on Python ${{ matrix.python }}. Full discovery, real FFmpeg/Chrome integrations, Windows installation and other Python versions are NOT RUN by this workflow; use the scheduled/manual Integration regression workflow. Smoke success does not certify those omitted checks.' >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci_pr.py

  contracts:
    name: Documentation and static syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check Python, Bash and Node syntax without executing source
        run: python scripts/ci_checks.py static
      - name: Run all documentation gates
        run: bash scripts/doc_gates.sh
