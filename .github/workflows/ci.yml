name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VTX_DOCTOR_OFFLINE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'

jobs:
  fast:
    name: Fast checks (reduced coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install lightweight test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check Python, Bash and Node syntax
        run: python scripts/ci_checks.py static
      - name: Run documentation gates
        run: bash scripts/doc_gates.sh
      - name: Run deterministic unit checks (zero skips)
        run: |
          echo 'Reduced coverage: syntax, documentation and selected pure unit checks on Python 3.13 only. Full regression, media rendering, filesystem/process safety, installation and other Python versions require manual workflows; they are NOT certified here.' >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci_fast.py
