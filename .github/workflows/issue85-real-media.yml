name: Issue85 dedicated real-media acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/issue85-real-media.yml'
      - 'scripts/issue85_real_media.py'
      - 'scripts/issue85_media_runner.py'
      - 'tests/test_issue85_real_media.py'
# First execution uses a reviewed same-repository dedicated PR; no default-branch
# registration trick, pull_request_target, secrets, or permission expansion.
permissions:
  contents: read
concurrency:
  group: issue85-real-media-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'work/issue85-real-media-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm harness-only delta and exact frozen objects
        working-directory: harness
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'.github/workflows/issue85-real-media.yml', 'scripts/issue85_real_media.py', 'scripts/issue85_media_runner.py', 'tests/test_issue85_real_media.py'}
          candidate = '68e94cae8afd5519737fa3fce250bfb045c75dfc'
          changed = set(subprocess.check_output(['git','diff','--name-only',candidate,'HEAD'],text=True).splitlines())
          assert changed and changed <= allowed, changed
          subprocess.run(['git','merge-base','--is-ancestor',candidate,'HEAD'],check=True)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b8820dbba6989dd216c8fa519633371e3d380cb6
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 68e94cae8afd5519737fa3fce250bfb045c75dfc
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tiny harness tests, then ordinary hosted tool preflight
        working-directory: harness
        run: |
          python -m unittest tests.test_issue85_real_media -v
          command -v ffmpeg
          command -v ffprobe
      - name: Qualify fixed NASA original and execute bounded paired experiment
        env:
          OUTPUT: ${{ runner.temp }}/issue85-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          unset PYTHONPATH PYTHONHOME
          python harness/scripts/issue85_real_media.py --execute-hosted \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --candidate "$GITHUB_WORKSPACE/candidate" --output "$OUTPUT"
      - name: Retain small evidence only, never media
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue85-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue85-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            ${{ runner.temp }}/issue85-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            ${{ runner.temp }}/issue85-${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
          if-no-files-found: warn
          retention-days: 14
