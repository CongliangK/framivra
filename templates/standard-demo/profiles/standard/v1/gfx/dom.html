<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- dom.html —— standard-demo/v1 静态 gfx 页（无 JS 动画；画面恒定的静态区间）。
     来源：tests/run_e2e.py DOM 页结构适配；透明画布；CJK；低 alpha（0.15）面板；
     内联 SVG。字体本地化：@font-face 指向包内 fonts/NotoSansSC-VF.ttf（OFL-1.1）。 -->
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url("../fonts/NotoSansSC-VF.ttf") format("truetype");
    font-weight: 100 900;
  }
  html, body { margin: 0; width: 1920px; height: 1080px;
               background: transparent; overflow: hidden;
               font-family: "Noto Sans SC", sans-serif; }
  .panel { position: absolute; left: 240px; top: 640px; width: 1000px;
           padding: 32px 40px; box-sizing: border-box;
           background: rgba(240, 180, 30, 0.15);   /* 低 alpha 检验目标 */
           border-radius: 12px; color: #ffffff; font-size: 48px; }
  svg { position: absolute; left: 240px; top: 180px; }
</style>
</head>
<body>
  <svg width="400" height="120" viewBox="0 0 400 120">
    <rect x="4" y="4" width="392" height="112" rx="10"
          fill="none" stroke="#7fd1ff" stroke-width="2" opacity="0.6"/>
    <text x="24" y="72" fill="#7fd1ff" font-size="36">SVG·静态区间</text>
  </svg>
  <div class="panel">DOM 静态页·低 alpha 0.15·CJK 排版</div>
</body>
</html>
