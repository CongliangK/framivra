<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- canvas.html —— standard-demo/v1 动态 gfx 页（帧驱动铁律：动画状态 = f 的纯函数）。
     来源：tests/run_e2e.py canvas 页结构适配；透明画布；CJK 文本；低 alpha 填充。
     本地化字体：@font-face 指向包内 fonts/NotoSansSC-VF.ttf（OFL-1.1），不外连。 -->
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url("../fonts/NotoSansSC-VF.ttf") format("truetype");
    font-weight: 100 900;
  }
  html, body { margin: 0; width: 1920px; height: 1080px;
               background: transparent; overflow: hidden; }
  #c { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const FPS = 30, N = 60;              // N == timeline 该 gfx clip 的 dur
const f = parseInt(new URLSearchParams(location.search).get("f") || "0");
const fi = Math.max(0, Math.min(f, N - 1));   // 页内钳制，保持纯函数
const ctx = document.getElementById("c").getContext("2d");
// 低 alpha 面板（A=38/255 ≈ 0.15）随帧平移——动态区间
ctx.fillStyle = "rgba(255,255,255,0.15)";
ctx.fillRect(180 + fi * 3, 180, 900, 360);
// CJK 文本 + 帧号读数
ctx.fillStyle = "#ffffff";
ctx.font = "60px 'Noto Sans SC', sans-serif";
ctx.fillText("标准示例·帧驱动画布 " + fi, 240 + fi * 3, 360);
window.__vtx_frame = fi;             // 只读探针，不参与动画状态
</script>
</body>
</html>
