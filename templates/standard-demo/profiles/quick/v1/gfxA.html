<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- gfxA.html —— skill-demo 最简 gfx 帧驱动页（协议权威 skill/references/gfx.md）：
     1920x1080 透明画布；全部动画状态 = f 的纯函数（?f= 查询参数）；
     禁 CSS animation/transition、Date.now、Math.random、rAF 时序。 -->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px;
               background: transparent; overflow: hidden;
               font-family: "Noto Sans CJK SC", sans-serif; }
  #wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .title { position: absolute; left: 0; right: 0; top: 430px;
           text-align: center; font-size: 96px; font-weight: 700;
           color: #ff8a3d; letter-spacing: 0.08em;
           text-shadow: 0 4px 18px rgba(0,0,0,0.45); }
  .sub { position: absolute; left: 0; right: 0; top: 560px;
         text-align: center; font-size: 40px; color: #f5efe6; }
  #bar { position: absolute; left: 660px; top: 640px; height: 10px;
         width: 0; border-radius: 5px;
         background: linear-gradient(90deg, #ff8a3d, #ffd166); }
</style>
</head>
<body>
<div id="wrap">
  <div class="title">虚拟歌手 · 搞笑企划</div>
  <div class="sub">skill-demo：零依赖纯内核出片</div>
  <div id="bar"></div>
</div>
<script>
const FPS = 30, N = 90;              // N == timeline 该 gfx clip 的 dur
const f = parseInt(new URLSearchParams(location.search).get("f") || "0");
const t = Math.min(f / FPS, N / FPS);
// 标准工具函数（gfx.md 模式库复制即用）
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eoc = x => 1 - Math.pow(1 - x, 3);

// 入场（0.15-0.9s 主体上浮+淡入）；结尾 0.4s 淡出（改 opacity，透明即透明）
const enter = eoc(seg(t, 0.15, 0.9));
const wrap = document.getElementById("wrap");
wrap.style.opacity = enter * (1 - seg(t, N / FPS - 0.4, N / FPS));
wrap.style.transform = `translateY(${(1 - enter) * 36}px)`;
// 进度条：宽度 = 播放进度（f 的纯函数）
document.getElementById("bar").style.width = (600 * clamp01(f / N)) + "px";
</script>
</body>
</html>
