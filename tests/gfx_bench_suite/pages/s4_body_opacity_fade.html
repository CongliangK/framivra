<!doctype html><html><head><meta charset="utf-8">
<!-- S4b · body opacity 拍平对抗页 · gfx 基准套件 issue #106（冻结于 suite_manifest.json v1.0.0）
     复刻 docs/DEV.md「gfx 透明页合成组拍平」节（本 checkout L87-89）g6a_title 事故形态：
     body 级 opacity 随帧连续变化（f=0 → 0.0，f≈60 → 1.0，f=119 → 0.0 的三角包络，
       每帧 alpha 严格不同），会使 Chrome 把整页合成组拍平——透明快路径
       （Emulation.setDefaultBackgroundColorOverride）静默失效，引擎必须靠
       双探针 flatten 守卫回落白黑双截解算；本页即量产在该路径上的对抗样本。
     同时叠加 mask-image: linear-gradient(...) 渐变遮罩（标题/副行），增加每帧
       重光栅面积与 alpha 通道复杂度。
     协议：1920x1080、30fps、N=120（4s）；动画状态 = f 的纯函数（?f= 查询参数）；
     禁 CSS 动画属性 / 墙钟取态 / 非 seeded 随机 / rAF 时序（skill/references/gfx.md）。
     刻意不声明 __vtx_static_spans / __vtx_export_png / __vtx_render。
     D22 配色：透明底 + 近黑字 + 琥珀点缀（叠层页大面积留透明让底视频透气）。 -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;
  font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1240px;padding:86px 60px 74px;text-align:center}
#title{font-size:88px;font-weight:800;letter-spacing:6px;color:#1a1a1a;white-space:nowrap;
  /* mask-image 渐变遮罩：左右两缘羽化消失，遮罩栅格化每帧参与 alpha 合成 */
  -webkit-mask-image:linear-gradient(100deg, transparent 0%, #000 17%, #000 83%, transparent 100%);
  mask-image:linear-gradient(100deg, transparent 0%, #000 17%, #000 83%, transparent 100%)}
#sub{margin-top:26px;font-size:30px;color:#6b7280;letter-spacing:10px;white-space:nowrap;
  -webkit-mask-image:linear-gradient(100deg, transparent 4%, #000 22%, #000 78%, transparent 96%);
  mask-image:linear-gradient(100deg, transparent 4%, #000 22%, #000 78%, transparent 96%)}
#bar{position:absolute;left:50%;bottom:38px;height:8px;width:900px;margin-left:-450px;
  border-radius:4px;background:linear-gradient(90deg,#c8a24a,#d97706);
  transform-origin:left;transform:scaleX(0)}
#tick{position:absolute;left:64px;bottom:34px;font-size:22px;font-weight:700;
  color:#b45309;letter-spacing:2px;font-variant-numeric:tabular-nums}
#ring{position:absolute;right:96px;top:88px;width:120px;height:120px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="frame">
    <div id="title">S4b · 合成组拍平对抗</div>
    <div id="sub">BODY OPACITY 0.0 → 1.0 → 0.0</div>
    <div id="bar"></div>
    <div id="tick">f=0000</div>
  </div>
  <svg id="ring" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#d97706" stroke-width="5"/>
  </svg>
</div>
<script>
/* ===== 帧驱动协议（30fps；同 f 同像素） ===== */
const FPS = 30, N = 120;                                  /* 冻结：120 帧（4s） */
const f = parseInt(new URLSearchParams(location.search).get("f") || "0");
const t = Math.min(f / FPS, N / FPS);
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eoc = x => 1 - Math.pow(1 - x, 3);

/* —— 核心：body 级 opacity 三角包络（f 的纯函数，逐帧严格单调变化）——
   f∈[0,59] 0→1 线性爬升；f∈[60,119] 1→0 线性回落；峰值在 f=59/60 之间。 */
document.body.style.opacity =
  clamp01(1 - Math.abs(2 * Math.min(f, N - 1) - (N - 1)) / (N - 1)).toFixed(4);

/* —— 内容层细节（同为 f 的纯函数；入/出场由 body opacity 统一承担） —— */
document.getElementById("bar").style.transform =
  `scaleX(${(0.18 + 0.80 * clamp01(f / (N - 1))).toFixed(4)})`;
document.getElementById("tick").textContent =
  "f=" + String(Math.min(f, N - 1)).padStart(4, "0");
const ringP = seg(t, .8, 2.2);
const ring = document.getElementById("ring");
ring.style.opacity = clamp01(ringP) * (1 - seg(t, 3.0, 3.7));
ring.style.transform = `scale(${(0.6 + 0.4 * eoc(ringP)).toFixed(4)}) rotate(${(40 * t).toFixed(2)}deg)`;
/* 遮罩角度随 t 缓旋：遮罩栅格每帧重算（羽化边界逐帧移动） */
const maskAng = (100 + 8 * Math.sin(t * 1.6)).toFixed(2);
const stops = { title: ["0%", "17%", "83%", "100%"], sub: ["4%", "22%", "78%", "96%"] };
for (const id of ["title", "sub"]) {
  const [a, b, c, d] = stops[id];
  const e = document.getElementById(id);
  const grad = `linear-gradient(${maskAng}deg, transparent ${a}, #000 ${b}, #000 ${c}, transparent ${d})`;
  e.style.webkitMaskImage = grad; e.style.maskImage = grad;
}
</script></body></html>
