# compare.sh 预期差异白名单（P0 复审裁定；只登记 ARCHITECTURE.md 已拍板的设计内变化）
# 语法：
#   json-drop-key   <norm文件名> <点路径>            双方剔除该键后比较（预期改写项）
#   json-drop-items <norm文件名> <数组路径> <字段> <正则>  剔除数组中字段匹配正则的条目（预期新增项）
#   num-tol         <norm文件名> <浮点容差>           该 JSON 浮点字段按容差比较
# 白名单外任何差异 = FAIL。重锚基线（baseline-r2/）建立后移除 audio 相关行。

# P1 响度终链合并（ARCHITECTURE §1.2/§1.3）：
# qc 新增 TP 判定项 / audio 的「整片真峰 TP」检查整体改写（首跑为 v1 未限幅行为：
# 实测 0.8 dBTP + INFO 判级；P1 后为 ≤-1.0 + FAIL 判级）——两侧同名检查整条剔除
json-drop-items qc.norm.json checks name (?i)tp|真峰
json-drop-items audio.norm.json checks name 真峰
# audio 判级表 TP 阈值改写（-1.0 dBFS 权威化）
json-drop-key audio.norm.json thresholds.tp_warn
json-drop-key audio.norm.json thresholds.tp_fail
# 实证 0.1 LUFS 级测量抖动容差（仅 audio JSON 浮点字段，如 checks[].measured.i_lufs）
num-tol audio.norm.json 0.15
