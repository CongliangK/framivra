<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>模板 · 分组数据表页（gfx-full · 白底暖色 · D22）</title>
<style>
/* ===== 模板：分组数据表页 =====
 * 用途：gfx-full 整页「口播没念的数据」表——分组行表 + 推荐行 + 右侧数据卡 + 选型脚注。
 * 来源：voice-ime v3.6 u2_backends.html（D34-④ 拍板形态：大文字+表格积极展示口播没提的数据；D22 白底暖色）。
 * 改哪里：只改下方 CONST DATA（文案/行数据/节拍秒表）；行数增减需同步增删 HTML 中对应 .row 块（结构注释见各块）。
 * 节拍法（句锁）：DATA.beats 全部是「页内秒」，须按挂载 dst 锚点 + 口播句窗换算填写；
 *   口播句→页内秒对照注释槽位见 DATA.beats 处注释。词位无词级时间戳时标「待视觉抽验」。
 * 红线：D22 零蓝零红绿装饰；主字段 ≤10 字、辅字段 ≤14 字；不透明整页全出血；
 *   pip 安全区（x≥1440∧y≥600）期间右列卡须收进 y≤584 紧凑版；本页尾 0.4s alpha 淡出（有下层时露出非黑场）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;
  font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:#faf9f6}

/* ---- 页眉（逐字入场） ---- */
#titlewrap{position:absolute;left:64px;top:62px;overflow:hidden;white-space:nowrap}
#title{font-size:48px;font-weight:900;color:#1a1a1a;letter-spacing:5px}
#title .ch{display:inline-block;opacity:0}
#tul{position:absolute;left:66px;top:136px;height:4px;width:330px;border-radius:2px;
  background:#d97706;opacity:0;transform-origin:left center}
#tsub{position:absolute;left:66px;top:154px;font-size:15px;color:#98928a;
  letter-spacing:5px;opacity:0;white-space:nowrap}

/* ---- 左·分组表卡（行数变化时按 72px 行高增删 .row，组头间距见原页 78px 节奏） ---- */
#tbl{position:absolute;left:64px;top:212px;width:1120px;height:660px;background:#fff;
  border:1px solid #e2ddcf;border-radius:20px;box-shadow:0 14px 40px rgba(70,58,24,.10)}
.grp{position:absolute;left:36px;right:36px;height:38px;display:flex;align-items:center;gap:13px}
.gsq{width:12px;height:12px;border-radius:3px;flex:none}
.gnm{font-size:19px;font-weight:900;color:#1a1a1a;letter-spacing:3px;white-space:nowrap}
.gab{font-size:12px;color:#98928a;letter-spacing:3px;font-weight:700;white-space:nowrap}
.gct{font-size:13px;font-weight:800;color:#6b6558;border:1.5px solid #c9c4b6;
  border-radius:999px;padding:2px 11px;background:#fff;white-space:nowrap;letter-spacing:1px}
.gdv{position:absolute;left:0;right:0;bottom:5px;height:1.5px;background:#e2ddcf;
  transform-origin:left center;transform:scaleX(0)}
.row{position:absolute;left:36px;right:36px;height:72px;border-bottom:1px solid #ddd8ca;
  display:flex;align-items:center}
.row.nb{border-bottom:none}
.row.zebra{background:#f7f5ef}
.hl{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0;background:#d97706}    /* 行亮起·琥珀底纹（瞬时） */
.bar{position:absolute;left:0px;top:20px;bottom:20px;width:5px;border-radius:3px;
  background:#d97706;transform-origin:center top;transform:scaleY(0);opacity:0}
.recov{position:absolute;left:-10px;right:-10px;top:3px;bottom:3px;border-radius:12px;
  opacity:0;pointer-events:none}                            /* 推荐行常亮琥珀框+浅底 */
.lab{display:flex;align-items:center;gap:16px;padding-left:16px;position:relative;z-index:2}
.chip{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;background:#fff;color:#1a1a1a;border:2px solid #1a1a1a;flex:none}
.nb1{display:flex;flex-direction:column;gap:3px}
.lname{font-size:24px;font-weight:900;color:#1a1a1a;letter-spacing:.5px;white-space:nowrap}
.lpar{font-size:14px;color:#98928a;letter-spacing:.5px;white-space:nowrap;font-weight:600}
.lpar.mono{font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace;letter-spacing:0}
.recb{background:#d97706;color:#fff;font-size:16px;font-weight:800;padding:5px 15px;
  border-radius:999px;letter-spacing:2px;opacity:0;flex:none;white-space:nowrap}
.val{margin-left:auto;padding-right:24px;display:flex;flex-direction:column;
  align-items:flex-end;gap:4px;position:relative;z-index:2;text-align:right}
.main{font-size:24px;font-weight:900;color:#1a1a1a;white-space:nowrap}
.aux{font-size:15px;color:#98928a;white-space:nowrap;font-weight:600}
.aux b{color:#b45309;font-weight:900}

/* ---- 右·数据亮点卡×2（pip 在位时收进 y≤584 紧凑版 178h×2；放口播没念的数据） ---- */
.card{position:absolute;left:1216px;width:640px;height:178px;background:#fff;
  border:1px solid #e2ddcf;border-radius:20px;box-shadow:0 14px 40px rgba(70,58,24,.10);opacity:0}
#cardA{top:212px}
#cardB{top:406px}
.chead{position:absolute;left:30px;top:22px;right:28px;display:flex;
  align-items:center;justify-content:space-between}
.clab{font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:2px;white-space:nowrap}
.cbadge{font-size:15px;font-weight:800;color:#b45309;border:1.5px solid rgba(217,119,6,.55);
  border-radius:999px;padding:3px 14px;background:#fdf6ea;letter-spacing:1px;white-space:nowrap;opacity:0}
.astat{position:absolute;left:30px;right:30px;top:58px;display:flex;align-items:stretch;gap:16px}
.asg{flex:1;background:#fff;border:1.5px solid rgba(26,26,26,.55);border-radius:14px;height:82px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.asl{font-size:18px;font-weight:800;color:#6b6558;letter-spacing:2px}
.asn{display:flex;align-items:baseline;gap:7px}
.asn .geq{font-size:23px;font-weight:900;color:#6b6558}
.asn b{font-size:42px;font-weight:900;color:#b45309}
.asn .asu{font-size:16px;font-weight:700;color:#98928a}
.ccap{position:absolute;left:0;right:0;bottom:14px;text-align:center;
  font-size:14px;color:#98928a;letter-spacing:1px;opacity:0}

/* ---- 底部脚注：选型行（y<948 避字幕区）+ 两角小字（y≈1032，字幕下缘之下） ---- */
#pick{position:absolute;left:64px;top:896px;display:flex;align-items:center;gap:14px;opacity:0}
#pksq{width:11px;height:11px;border-radius:3px;background:#d97706;flex:none}
#pklab{font-size:19px;font-weight:900;color:#1a1a1a;letter-spacing:3px;white-space:nowrap}
#pktxt{font-size:21px;font-weight:700;color:#1a1a1a;white-space:nowrap}
#pktxt b{color:#b45309;font-weight:900}
#footL{position:absolute;left:66px;bottom:34px;font-size:15px;color:#98928a;
  letter-spacing:1px;opacity:0;white-space:nowrap}
#footR{position:absolute;right:64px;bottom:34px;font-size:15px;color:#98928a;
  letter-spacing:1px;opacity:0;white-space:nowrap;
  font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace}
</style></head><body>
<div id="stage">
  <div id="bg"></div>

  <div id="titlewrap"><div id="title"></div></div>
  <div id="tul"></div>
  <div id="tsub"></div>

  <!-- 分组表卡：3 组 × 7 行（组/行数变化时增删块并同步 top 排版与 DATA.beats） -->
  <div id="tbl">
    <div class="grp" style="top:16px">
      <div class="gsq" id="gs0"></div><div class="gnm" id="gn0"></div>
      <div class="gab" id="ga0"></div><div class="gct" id="gc0"></div><div class="gdv" id="gv0"></div>
    </div>
    <!-- 行 0＝推荐行（含常亮框 rc0 + 徽章 recb） -->
    <div class="row" style="top:54px" id="rw0">
      <div class="hl" id="hl0"></div><div class="bar" id="br0"></div><div class="recov" id="rc0"></div>
      <div class="lab">
        <div class="chip" id="ch0"></div>
        <div class="nb1"><div class="lname" id="nm0"></div><div class="lpar" id="pm0"></div></div>
        <div class="recb" id="recb"></div>
      </div>
      <div class="val"><div class="main" id="mw0"></div><div class="aux" id="ax0"></div></div>
    </div>
    <div class="row zebra" style="top:126px" id="rw1">
      <div class="hl" id="hl1"></div><div class="bar" id="br1"></div>
      <div class="lab"><div class="chip" id="ch1"></div>
        <div class="nb1"><div class="lname" id="nm1"></div><div class="lpar" id="pm1"></div></div></div>
      <div class="val"><div class="main" id="mw1"></div><div class="aux" id="ax1"></div></div>
    </div>
    <div class="row" style="top:198px" id="rw2">
      <div class="hl" id="hl2"></div><div class="bar" id="br2"></div>
      <div class="lab"><div class="chip" id="ch2"></div>
        <div class="nb1"><div class="lname" id="nm2"></div><div class="lpar" id="pm2"></div></div></div>
      <div class="val"><div class="main" id="mw2"></div><div class="aux" id="ax2"></div></div>
    </div>
    <div class="row zebra nb" style="top:270px" id="rw3">
      <div class="hl" id="hl3"></div><div class="bar" id="br3"></div>
      <div class="lab"><div class="chip" id="ch3"></div>
        <div class="nb1"><div class="lname" id="nm3"></div><div class="lpar" id="pm3"></div></div></div>
      <div class="val"><div class="main" id="mw3"></div><div class="aux" id="ax3"></div></div>
    </div>
    <div class="grp" style="top:348px">
      <div class="gsq" id="gs1"></div><div class="gnm" id="gn1"></div>
      <div class="gab" id="ga1"></div><div class="gct" id="gc1"></div><div class="gdv" id="gv1"></div>
    </div>
    <div class="row" style="top:386px" id="rw4">
      <div class="hl" id="hl4"></div><div class="bar" id="br4"></div>
      <div class="lab"><div class="chip" id="ch4"></div>
        <div class="nb1"><div class="lname" id="nm4"></div><div class="lpar" id="pm4"></div></div></div>
      <div class="val"><div class="main" id="mw4"></div><div class="aux" id="ax4"></div></div>
    </div>
    <div class="row zebra nb" style="top:458px" id="rw5">
      <div class="hl" id="hl5"></div><div class="bar" id="br5"></div>
      <div class="lab"><div class="chip" id="ch5"></div>
        <div class="nb1"><div class="lname" id="nm5"></div><div class="lpar" id="pm5"></div></div></div>
      <div class="val"><div class="main" id="mw5"></div><div class="aux" id="ax5"></div></div>
    </div>
    <div class="grp" style="top:536px">
      <div class="gsq" id="gs2"></div><div class="gnm" id="gn2"></div>
      <div class="gab" id="ga2"></div><div class="gct" id="gc2"></div><div class="gdv" id="gv2"></div>
    </div>
    <div class="row nb" style="top:574px" id="rw6">
      <div class="hl" id="hl6"></div><div class="bar" id="br6"></div>
      <div class="lab"><div class="chip" id="ch6"></div>
        <div class="nb1"><div class="lname" id="nm6"></div><div class="lpar mono" id="pm6"></div></div></div>
      <div class="val"><div class="main" id="mw6"></div><div class="aux" id="ax6"></div></div>
    </div>
  </div>

  <!-- 数据亮点卡 A/B（双格数值 + 数字滚动；见 DATA.cardA/cardB） -->
  <div class="card" id="cardA">
    <div class="chead"><span class="clab" id="cardAlab"></span><span class="cbadge" id="cardAbadge"></span></div>
    <div class="astat">
      <div class="asg" id="cardAg0">
        <div class="asl" id="cardAl0"></div>
        <div class="asn"><span class="geq" id="cardAgeq">≥</span><b id="cardAn0">0</b><span class="asu" id="cardAu0"></span></div>
      </div>
      <div class="asg" id="cardAg1">
        <div class="asl" id="cardAl1"></div>
        <div class="asn"><span class="geq" id="cardAgeq1">≥</span><b id="cardAn1">0</b><span class="asu" id="cardAu1"></span></div>
      </div>
    </div>
    <div class="ccap" id="cardAcap"></div>
  </div>
  <div class="card" id="cardB">
    <div class="chead"><span class="clab" id="cardBlab"></span><span class="cbadge" id="cardBbadge"></span></div>
    <div class="astat">
      <div class="asg" id="cardBg0">
        <div class="asl" id="cardBl0"></div>
        <div class="asn"><b id="cardBn0">0.00</b><span class="asu" id="cardBu0"></span></div>
      </div>
      <div class="asg" id="cardBg1">
        <div class="asl" id="cardBl1"></div>
        <div class="asn"><b id="cardBn1">0.00</b><span class="asu" id="cardBu1"></span></div>
      </div>
    </div>
    <div class="ccap" id="cardBcap"></div>
  </div>

  <div id="pick">
    <div id="pksq"></div>
    <div id="pklab"></div>
    <div id="pktxt"></div>
  </div>
  <div id="footL"></div>
  <div id="footR"></div>
</div>

<script>
/* ===== CONST DATA：本页全部文案与数据（改这里，别改机制代码） ===== */
const DATA = {
  title: "分组数据表 · 换成你的标题",          // 页眉逐字入场（长度自适应）
  sub:   "TEMPLATE · GROUPED DATA TABLE",      // 页眉副行（小字距行）
  N: 896,                                      // 总帧数（30fps；= timeline 挂载 out-in）
  groups: [                                    // 组头：[名, 英文小字, 计数章, 色块色]
    ["分组一", "GROUP A", "4 种", "#d97706"],
    ["分组二", "GROUP B", "2 种", "#c8a24a"],
    ["分组三", "GROUP C", "1 种", "#98928a"],
  ],
  rows: [                                      // 行：chip 序号 / name 主名 / param 参数（mono:true 走等宽） /
    { chip: "1", name: "条目一",  param: "参数 A", main: "主字段 ≤10 字", aux: "辅字段 ≤14 字" },
    { chip: "2", name: "条目二",  param: "参数 B", main: "主字段", aux: "辅字段" },
    { chip: "3", name: "条目三",  param: "参数 C", main: "主字段", aux: "辅字段" },
    { chip: "4", name: "条目四",  param: "参数 D", main: "主字段", aux: "辅字段" },
    { chip: "5", name: "条目五",  param: "参数 E", main: "主字段", aux: "辅字段" },
    { chip: "6", name: "条目六",  param: "参数 F", main: "主字段", aux: "辅字段 <b>5000</b> · 强调数" }, // <b>=琥珀强调
    { chip: "7", name: "条目七",  param: "ENV_VAR_NAME", main: "主字段", aux: "辅字段", mono: true },
  ],
  recommend: { badge: "推荐", main: "默认选项 · 主推" },   // 行 0 为推荐行；null 则下移到 DATA.beats.rec 注释
  cardA: {                                     // 数据卡 A：双格数值 + 数字滚动（整数）
    lab: "卡片 A 标签", badge: "数据来源章",
    cells: [
      { label: "格 1", geq: "≥", value: 5000, unit: "单位", roll: [22.8, 23.8] },  // roll=[滚动起,止]（页内秒）
      { label: "格 2", geq: "≥", value: 2000, unit: "单位", roll: [25.8, 26.8], pulse: [26.0, 27.6, 28.8] },
    ],
    cap: "卡片 A 说明行", enter: 18.4,
  },
  cardB: {                                     // 数据卡 B：双格小数滚动（toFixed(2)）
    lab: "卡片 B 标签", badge: "基准名",
    cells: [
      { label: "格 1", value: 2.71, unit: "指标", roll: [15.0, 16.0] },
      { label: "格 2", value: 3.15, unit: "指标", roll: [15.2, 16.2] },
    ],
    cap: "卡片 B 说明行（越低越好之类）", enter: 14.6,
  },
  pick: { label: "选型", html: "条件甲 <b>→</b> 选项一　·　条件乙 <b>→</b> 选项二（自备 XX）", enter: 8.8 },
  footL: "左下脚注 · 数据来源登记", footR: "右下脚注 · 环境变量或开关名",
  beats: {                                     // ★ 句锁节拍（页内秒）——按挂载 dst 锚点+口播句窗换算重填：
    groupT: [1.5, 3.5, 6.0],                   //   组头错峰（随口播分组句起）
    rowT:   [1.9, 2.35, 2.8, 3.25, 3.9, 4.5, 6.4],  // 行错峰（随逐条口播）
    rec:    14.0,                              //   推荐行徽章（随「最推荐 X」句）
    footL:  9.6, footR: 10.0,                  //   两角脚注
    pulse:  null,                              //   卡 A 格 2 脉冲窗在 cells[1].pulse
  },
  /* 口播句→页内秒对照（句锁校准表，须随挂载窗重算）：
     组一句「……随意更换」≈t1.7 → 组头 1.5 / 行0 1.9
     组二句「……云端服务/本地服务」≈t3.3-5.0 → 组头 3.5 / 行4 3.9 / 行5 4.5
     推荐句「……最推荐的是 X」≈t14 → rec=14.0 + cardB.enter=14.6（佐证推荐） */
};

/* ===== 帧驱动协议（D8：URL ?f= 帧号 + 纯函数渲染；D24：30fps；同 f 同像素） ===== */
const FPS = 30, N = DATA.N;
const f = parseInt(new URLSearchParams(location.search).get("f") || "0");
const t = Math.min(f / FPS, N / FPS);

/* ---- 工具函数（_tokens.md 标准件） ---- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg  = (x, a, b) => clamp01((x - a) / (b - a));
const eoc  = x => 1 - Math.pow(1 - x, 3);
const eoe  = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eob  = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);

/* ---- CONST 文案注入 DOM ---- */
$("tsub").textContent = DATA.sub;
DATA.groups.forEach((g, i) => {
  $("gs" + i).style.background = g[3]; $("gn" + i).textContent = g[0];
  $("ga" + i).textContent = g[1]; $("gc" + i).textContent = g[2];
});
DATA.rows.forEach((r, i) => {
  $("ch" + i).textContent = r.chip; $("nm" + i).textContent = r.name;
  if (r.mono) $("pm" + i).classList.add("mono");
  $("pm" + i).textContent = r.param;
  $("mw" + i).textContent = i === 0 && DATA.recommend ? DATA.recommend.main : r.main;
  $("ax" + i).innerHTML = r.aux;
});
if (DATA.recommend) $("recb").textContent = DATA.recommend.badge;
$("cardAlab").textContent = DATA.cardA.lab; $("cardAbadge").textContent = DATA.cardA.badge;
DATA.cardA.cells.forEach((c, i) => {
  $("cardAl" + i).textContent = c.label; $("cardAgeq" + (i ? "1" : "")).textContent = c.geq || "";
  $("cardAu" + i).textContent = c.unit;
});
$("cardAcap").textContent = DATA.cardA.cap;
$("cardBlab").textContent = DATA.cardB.lab; $("cardBbadge").textContent = DATA.cardB.badge;
DATA.cardB.cells.forEach((c, i) => {
  $("cardBl" + i).textContent = c.label; $("cardBu" + i).textContent = c.unit;
});
$("cardBcap").textContent = DATA.cardB.cap;
$("pklab").textContent = DATA.pick.label; $("pktxt").innerHTML = DATA.pick.html;
$("footL").textContent = DATA.footL; $("footR").textContent = DATA.footR;

/* gfx-full 有下层时结尾 0.4s alpha 淡出（露出下层非黑场）；无下层删除此行（D21：禁全局淡入淡出） */
document.body.style.opacity = 1 - clamp01(seg(t, N / FPS - .4, N / FPS));

/* ---- 页眉（0.12-1.4 逐字） ---- */
[...DATA.title].forEach((c, i) => {
  const s = document.createElement("span"); s.className = "ch"; s.textContent = c;
  const p = eoe(seg(t, .12 + i * .05, .68 + i * .05));
  s.style.opacity = p;
  s.style.transform = `translateY(${(1 - p) * 110}%) rotate(${(1 - p) * 5}deg)`;
  $("title").appendChild(s);
});
$("tul").style.opacity = clamp01(seg(t, .5, .75));
$("tul").style.transform = `scaleX(${eoc(seg(t, .5, 1.05))})`;
$("tsub").style.opacity = eoc(seg(t, .68, 1.15));
$("tsub").style.letterSpacing = `${5 + 5 * (1 - eoc(seg(t, .68, 1.35)))}px`;

/* ---- 表壳（0.15-0.9） ---- */
const tbl = $("tbl");
tbl.style.opacity = clamp01(seg(t, .15, .55));
tbl.style.transform = `translateY(${(1 - eoc(seg(t, .15, .9))) * 46}px)`;

/* ---- 组头错峰（标签滑入 + 数量章弹入 + 分隔线生长） ---- */
DATA.beats.groupT.forEach((a, g) => {
  const q = eoc(seg(t, a, a + .55));
  ["gs", "gn", "ga"].forEach(p => {
    const el = $(p + g); el.style.opacity = q;
    el.style.transform = `translateY(${(1 - q) * 10}px)`;
  });
  const cp = eob(seg(t, a + .15, a + .6));
  const gc = $("gc" + g);
  gc.style.opacity = clamp01(seg(t, a + .15, a + .38));
  gc.style.transform = `scale(${.6 + .4 * cp})`;
  $("gv" + g).style.transform = `scaleX(${eoc(seg(t, a + .1, a + .9))})`;
});

/* ---- 行 ROWT 错峰（行亮起 1.4s 回落斑马纹；序号章 eob 弹入；名称/主字段同步、辅字段晚 0.1s） ---- */
DATA.beats.rowT.forEach((a, i) => {
  const p = eoc(seg(t, a, a + .7));
  const hl = $("hl" + i);
  hl.style.opacity = (.10 * p * (1 - seg(t, a + 1.0, a + 2.4))).toFixed(4);
  const br = $("br" + i); br.style.transform = `scaleY(${p})`; br.style.opacity = p;
  const ch = $("ch" + i);
  ch.style.transform = `scale(${eob(seg(t, a + .05, a + .55))})`;
  ch.style.opacity = clamp01(seg(t, a + .05, a + .3));
  const q = eoc(seg(t, a + .12, a + .65));
  $("nm" + i).style.opacity = q; $("nm" + i).style.transform = `translateY(${(1 - q) * 16}px)`;
  $("pm" + i).style.opacity = q; $("pm" + i).style.transform = `translateY(${(1 - q) * 12}px)`;
  $("mw" + i).style.opacity = q; $("mw" + i).style.transform = `translateY(${(1 - q) * 16}px)`;
  const ax = $("ax" + i);
  if (ax) { const r = eoc(seg(t, a + .22, a + .75)); ax.style.opacity = r; ax.style.transform = `translateY(${(1 - r) * 12}px)`; }
});

/* ---- 推荐行（行 0）：常亮琥珀框 + 徽章弹入 + 辉光呼吸（拍点=DATA.beats.rec；recommend:null 时整段跳过，守卫 2026-10-04 avt 实案回馈） ---- */
(function () {
  if (!DATA.recommend) return;
  const a = DATA.beats.rec;
  const recP = eoc(seg(t, a, a + .8)), rset = eoc(seg(t, a + .9, a + 1.9));
  const rc0 = $("rc0");
  rc0.style.opacity = 1;
  rc0.style.background = `rgba(217,119,6,${(.07 * recP).toFixed(3)})`;
  rc0.style.border = `2px solid rgba(217,119,6,${(.85 * recP).toFixed(3)})`;
  rc0.style.boxShadow = `0 0 ${(14 + 8 * Math.sin(t * 1.6)) * rset}px rgba(217,119,6,${(.20 * rset).toFixed(3)})`;
  const recb = $("recb");
  recb.style.transform = `scale(${eob(seg(t, a, a + .5))}) translateY(${(1 - eob(seg(t, a, a + .5))) * 14}px)`;
  recb.style.opacity = clamp01(seg(t, a, a + .25));
  recb.style.boxShadow = `0 0 ${(9 + 5 * Math.sin(t * 1.9)) * rset}px rgba(217,119,6,${(.45 * rset).toFixed(3)})`;
})();

/* ---- 数据卡 A（入场+双格+整数滚动+格 2 脉冲） ---- */
(function () {
  const a = DATA.cardA.enter, card = $("cardA");
  const q = eoc(seg(t, a, a + .7));
  card.style.opacity = clamp01(seg(t, a, a + .35));
  card.style.transform = `translateY(${(1 - q) * 36}px)`;
  const h = eoc(seg(t, a + .2, a + .65));
  $("cardAlab").style.opacity = h; $("cardAlab").style.transform = `translateY(${(1 - h) * 12}px)`;
  const bp = eob(seg(t, a + .35, a + .8));
  $("cardAbadge").style.opacity = clamp01(seg(t, a + .35, a + .55));
  $("cardAbadge").style.transform = `scale(${.6 + .4 * bp})`;
  const g0 = eoc(seg(t, a + .3, a + .75)), g1 = eoc(seg(t, a + .45, a + .9));
  $("cardAg0").style.opacity = g0; $("cardAg0").style.transform = `translateY(${(1 - g0) * 14}px)`;
  $("cardAg1").style.opacity = g1; $("cardAg1").style.transform = `translateY(${(1 - g1) * 14}px)`;
  $("cardAcap").style.opacity = eoc(seg(t, a + .6, a + 1.0));
  DATA.cardA.cells.forEach((c, i) => {
    $("cardAn" + i).textContent = Math.round(c.value * eoe(seg(t, c.roll[0], c.roll[1])));
    if (c.pulse) {
      const pu = clamp01(seg(t, c.pulse[0], c.pulse[0] + .3)) * (1 - clamp01(seg(t, c.pulse[1], c.pulse[2])));
      const g = $("cardAg" + i);
      g.style.borderColor = pu > 0 ? "rgba(217,119,6,.80)" : "rgba(26,26,26,.55)";
      g.style.boxShadow = `0 0 ${16 * pu}px rgba(217,119,6,${(.30 * pu).toFixed(3)})`;
    }
  });
})();

/* ---- 数据卡 B（小数滚动） ---- */
(function () {
  const a = DATA.cardB.enter, card = $("cardB");
  const q = eoc(seg(t, a, a + .7));
  card.style.opacity = clamp01(seg(t, a, a + .35));
  card.style.transform = `translateY(${(1 - q) * 36}px)`;
  const h = eoc(seg(t, a + .2, a + .65));
  $("cardBlab").style.opacity = h; $("cardBlab").style.transform = `translateY(${(1 - h) * 12}px)`;
  const bp = eob(seg(t, a + .35, a + .8));
  $("cardBbadge").style.opacity = clamp01(seg(t, a + .35, a + .55));
  $("cardBbadge").style.transform = `scale(${.6 + .4 * bp})`;
  const g0 = eoc(seg(t, a + .3, a + .75)), g1 = eoc(seg(t, a + .45, a + .9));
  $("cardBg0").style.opacity = g0; $("cardBg0").style.transform = `translateY(${(1 - g0) * 14}px)`;
  $("cardBg1").style.opacity = g1; $("cardBg1").style.transform = `translateY(${(1 - g1) * 14}px)`;
  $("cardBcap").style.opacity = eoc(seg(t, a + .6, a + 1.0));
  DATA.cardB.cells.forEach((c, i) => {
    $("cardBn" + i).textContent = (c.value * eoe(seg(t, c.roll[0], c.roll[1]))).toFixed(2);
  });
})();

/* ---- 脚注：选型行 + 两角小字 ---- */
(function () {
  const q = eoc(seg(t, DATA.pick.enter, DATA.pick.enter + .7));
  $("pick").style.opacity = q;
  $("pick").style.transform = `translateY(${(1 - q) * 14}px)`;
  const l = eoc(seg(t, DATA.beats.footL, DATA.beats.footL + .55));
  $("footL").style.opacity = l;
  const r = eoc(seg(t, DATA.beats.footR, DATA.beats.footR + .55));
  $("footR").style.opacity = r; $("footR").style.transform = `translateX(${(1 - r) * 14}px)`;
})();
</script></body></html>
