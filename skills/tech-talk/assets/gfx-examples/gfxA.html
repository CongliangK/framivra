<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;font-family:"Noto Sans CJK SC",sans-serif;overflow:hidden}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const FPS=24,N=192,f=parseInt(new URLSearchParams(location.search).get("f")||"0"),t=Math.min(f/FPS,N/FPS);
const cv=document.getElementById("c"),x=cv.getContext("2d");
const clamp01=v=>Math.max(0,Math.min(1,v)),seg=(t,a,b)=>clamp01((t-a)/(b-a));
const eoc=x=>1-Math.pow(1-x,3),eob=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const R=rng(7);const bars=[];for(let i=0;i<64;i++)bars.push({p:R(),s:.5+R()*.9,ph:R()*6.28});

x.clearRect(0,0,1920,1080);
/* 漂移光斑 */
x.globalAlpha=.35;let g=x.createRadialGradient(300+Math.sin(t*.3)*120,250,0,300,250,700);
g.addColorStop(0,"#0e7490");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,1920,1080);
g=x.createRadialGradient(1650+Math.cos(t*.25)*100,880,0,1650,880,700);
g.addColorStop(0,"#6d28d9");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,1920,1080);
x.globalAlpha=1;

/* 主标题：逐字上浮 */
const T1="多轨合成测试",T2="MULTI-TRACK COMPOSITE";
const ap=eoc(seg(t,.2,1.1));
x.font="900 150px 'Noto Sans CJK SC'";x.textAlign="center";
let tw=x.measureText(T1).width,cx=960-tw/2;
[...T1].forEach((ch,i)=>{const p=eoc(seg(t,.2+i*.06,1.0+i*.06));
  x.save();x.globalAlpha=p;const gx=cx+i*(tw/T1.length)+tw/T1.length/2;
  const lg=x.createLinearGradient(cx,0,cx+tw,0);lg.addColorStop(0,"#e0f2fe");lg.addColorStop(.5,"#67e8f9");lg.addColorStop(1,"#c4b5fd");
  x.fillStyle=lg;x.shadowColor="rgba(103,232,249,.4)";x.shadowBlur=70;
  x.translate(gx,300+(1-p)*110);x.fillText(ch,0,0);x.restore()});
const sp=eoc(seg(t,.8,1.6));
x.globalAlpha=sp;x.fillStyle="#7dd3fc";x.font="400 34px 'Noto Sans CJK SC'";
x.save();x.translate(960,370);x.scale(1,1);x.fillText(T2,0,0);x.restore();x.globalAlpha=1;

/* 频谱条（音频轨隐喻）64 条 */
const bp=seg(t,.9,1.8);
x.save();x.translate(960,660);
for(let i=0;i<64;i++){const b=bars[i];
  const v=Math.max(0,Math.sin(t*b.s*3+b.ph))**2*(60+320*b.p)*eoc(bp);
  const w=18,gap=9,ox=(64*(w+gap))/2-(w+gap)/2;
  const lg=x.createLinearGradient(0,-v,0,0);lg.addColorStop(0,"#f472b6");lg.addColorStop(.6,"#a78bfa");lg.addColorStop(1,"#22d3ee");
  x.fillStyle=lg;x.globalAlpha=.25+.75*eoc(bp);
  x.fillRect(ox+i*(w+gap),-v,w,v);
  x.fillRect(ox+i*(w+gap),4,w,10*Math.sin(t*2+i)*.5+6)}
x.restore();

/* 四轨标签 */
const labels=["BED 0.22","VOICE 0.85","SFX ×5","AMB pan ±0.6"];
labels.forEach((L,i)=>{const p=eob(seg(t,1.4+i*.15,1.9+i*.15));
  x.save();x.globalAlpha=clamp01(p);x.translate(960,905+i*46);
  x.font="700 30px 'Noto Sans CJK SC'";x.fillStyle=i%2?"#f1f5f9":"#67e8f9";
  x.fillText(L,0,0);x.restore()});

/* 呼吸描边框 */
x.globalAlpha=.5+.3*Math.sin(t*2);x.strokeStyle="rgba(103,232,249,.8)";x.lineWidth=4;
x.strokeRect(40+6*Math.sin(t),40+6*Math.cos(t*1.3),1840,1000);x.globalAlpha=1;

/* 结尾整体淡出 */
document.body.style.opacity=1-clamp01(seg(t,7.55,7.95));
</script></body></html>
