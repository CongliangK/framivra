# pyproject.toml —— v2 包化（ARCHITECTURE §5.2）
# 包名 framivra（项目品牌名；仓目录沿用 video_tools 历史路径名）；
# console scripts 双入口：`vtx`（渲染 CLI，vtx.cli:main）与
# `vt`（统一入口 doctor/list/check/version/init/--fix-links，vt:main）。
# vt.py 在仓根（不在 vtx/ 包内），经 py-modules 以顶层模块身份进发行包。
# pip 包只含内核（vtx/ 含 pluginlib + vt.py）；apps/plugins/skills/examples
# 不进发行包。clone 即用与 pip 安装并存：repo 根可直接 `python3 vt.py` /
# `python3 vtx/vtx.py` / `python3 -m vtx`，与安装后同码同义。
# 内核零第三方依赖（仅 python3 标准库 + 外部 ffmpeg/ffprobe/Chrome）。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "framivra"
version = "2.0.1"
description = "Framivra — reproducible, frame-accurate video production toolkit (vtx kernel: timeline.json → ffmpeg)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "ruochongliang", email = "ruochongliang@users.noreply.github.com" },
]
keywords = ["framivra", "video", "ffmpeg", "timeline", "editing", "rendering", "bilibili", "multimedia"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/CongliangK/framivra"
Repository = "https://github.com/CongliangK/framivra"

[project.scripts]
vtx = "vtx.cli:main"
vt = "vt:main"

[tool.setuptools]
packages = ["vtx", "vtx.pluginlib"]
py-modules = ["vt"]

[tool.setuptools.package-data]
# timeline.schema.json = 结构权威、preview.html = 预览权威（stages.py 模块头三处互指）。
# VERSION：clone 即用由 repo 根文件直读（vtx/__init__ 与 vt.py）；pip/wheel 安装布局
# 无根文件，vtx._read_version 回退链（B01/F-03/#25）= 包内 VERSION → pyproject
# version 行（源树）→ importlib.metadata（已安装发行包，wheel 布局权威源）→ 内置
# 字面量（与三源同步）。此处 "VERSION" 为发布流程把 VERSION 置入 vtx/ 时预留的
# 读取通道（vtx._read_version 的第二优先级），当前源树不重复维护该文件（单一事实
# 源在仓根）。
vtx = ["timeline.schema.json", "preview.html", "VERSION"]
