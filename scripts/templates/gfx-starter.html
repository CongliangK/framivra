<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>帧驱动图表示例</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; background: transparent;
  overflow: hidden; font-family: "Noto Sans CJK SC", sans-serif; color: #1a1a1a; }
/* 自带浅底；所有关键内容右界 <= 1320，避让右下 pip。 */
#sheet { position: absolute; inset: 0; background: #faf9f6; }
#card { position: absolute; left: 120px; top: 140px; width: 1200px;
  height: 740px; padding: 64px; background: #fff; border: 2px solid #eee9df; }
h1 { font-size: 56px; font-weight: 700; }
#chart { display: flex; align-items: flex-end; gap: 72px; height: 460px;
  margin-top: 32px; padding: 0 40px 64px; border-bottom: 3px solid #eee9df; }
.column { position: relative; width: 240px; height: 100%; display: flex;
  align-items: flex-end; }
.bar { width: 100%; background: #c8a24a; border-radius: 12px 12px 0 0;
  position: relative; }
.value { position: absolute; bottom: calc(100% + 12px); width: 100%;
  text-align: center; font-size: 32px; }
.label { position: absolute; top: calc(100% + 16px); width: 100%;
  text-align: center; font-size: 28px; }
</style>
</head>
<body>
<div id="sheet"></div>
<main id="card"><h1 id="heading"></h1><div id="chart"></div></main>
<script>
// 改文案/数据/暖色即可；N 须与 timeline 中此 gfx clip 的 dur 一致。
const DATA = { title: "示例数据", labels: ["甲", "乙", "丙"], values: [40, 65, 90] };
const COLORS = ["#c8a24a", "#d97706", "#b89046"];
const FPS = 30, N = 192;
const f = parseInt(new URLSearchParams(location.search).get("f") || "0", 10);
const t = Math.min(f / FPS, N / FPS);
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eoc = x => 1 - Math.pow(1 - x, 3);
document.getElementById("heading").textContent = DATA.title;
DATA.values.forEach((value, i) => {
  const column = document.createElement("div");
  column.className = "column";
  const bar = document.createElement("div");
  bar.className = "bar";
  // f=0 也保留可见图形，入场仅改变数据柱高度，不露黑底。
  const progress = 0.12 + 0.88 * eoc(seg(t, i * 0.12, 1.2 + i * 0.12));
  bar.style.height = `${value * 3.2 * progress}px`;
  bar.style.background = COLORS[i];
  const number = document.createElement("div");
  number.className = "value";
  number.textContent = Math.round(value * progress);
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = DATA.labels[i];
  bar.append(number, label);
  column.appendChild(bar);
  document.getElementById("chart").appendChild(column);
});
// 本页是有实拍下层的叠层：最后 12 帧（0.4s）统一 alpha 淡出。
document.body.style.opacity = 1 - clamp01(seg(t, N/FPS - 0.4, N/FPS));
</script>
</body>
</html>
