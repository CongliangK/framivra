<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 两支柱导航卡（gfx-full · 白底暖色 · D22）</title>
<style>
/* ===== 模板：两支柱导航卡 =====
 * 用途：gfx-full 整页「视频结构预告」——顶标逐字 + 两张支柱大卡（暗态弹入在位 →
 *   口播词拍「点亮」→ 双亮定格+琥珀辉光呼吸）；配 w_* 段落入口小卡构成导航卡族。
 * 来源：voice-ime v3.9 nav_two_pillars.html（v3.8 方案B 句锁改造；v3.9 尾延实证=节拍帧与 N 解耦）。
 * 改哪里：CONST DATA（顶标/副行/两卡名/tag/glyph SVG/点亮帧）；glyph 换成符合本片主题的内联 SVG。
 * 节拍法=句锁词位：F_L1/F_L2 对准口播「P1 怎么用」「P2 怎么做」词首（无词级时间戳时标「待视觉抽验」）。
 * 机制：rgb() 数组插值做 暗态灰→点亮琥珀墨 渐变；延长定格零改动（只改 N，节拍帧不动）。
 * 红线：D22 白底暖色；gfx-full 无下层 opacity 恒 1、硬切（D14/D21）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;
  font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:#faf9f6}

/* ---- 顶标 ---- */
#titlewrap{position:absolute;top:96px;left:0;width:100%;text-align:center;overflow:hidden;padding:0 40px}
#title{font-size:56px;font-weight:800;letter-spacing:14px;display:inline-block;white-space:nowrap}
#title .ch{display:inline-block;opacity:0;color:#1a1a1a}
#underline{position:absolute;top:186px;left:50%;height:4px;width:520px;margin-left:-260px;border-radius:2px;
  background:#d97706;opacity:0}
#sub{position:absolute;top:210px;width:100%;text-align:center;color:#9ca3af;font-size:17px;letter-spacing:8px;
  opacity:0;white-space:nowrap;font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace}

/* ---- 两支柱大卡（暗态入场 → 口播词拍点亮 → 双亮定格） ---- */
.pillar{position:absolute;top:330px;width:660px;height:480px;border-radius:22px;background:#ffffff;
  border:2.5px solid rgb(204,204,204);box-shadow:0 6px 22px rgba(26,26,26,.08);
  opacity:0;transform-origin:50% 50%}
#pL{left:210px}
#pR{left:1050px}
.pidx{position:absolute;top:24px;left:28px;font-size:17px;font-weight:700;letter-spacing:2px;
  font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace}
.pname{position:absolute;top:62px;left:0;width:100%;text-align:center;font-size:52px;font-weight:900;
  letter-spacing:8px;white-space:nowrap}
.pline{position:absolute;top:158px;left:50%;width:120px;height:3px;margin-left:-60px;border-radius:2px;
  background:#d97706;transform-origin:center;transform:scaleX(0)}
.pglyph{position:absolute;top:206px;left:0;width:100%;height:190px}
.ptag{position:absolute;bottom:28px;left:0;width:100%;text-align:center;font-size:19px;
  letter-spacing:2px;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>

  <div id="titlewrap"><div id="title"></div></div>
  <div id="underline"></div>
  <div id="sub"></div>

  <!-- 支柱卡 ×2（glyph SVG 由 CONST DATA 注入；换主题=换 glyph 字串） -->
  <div class="pillar" id="pL">
    <div class="pidx"></div>
    <div class="pname"></div>
    <div class="pline"></div>
    <svg class="pglyph" viewBox="0 0 660 190"></svg>
    <div class="ptag"></div>
  </div>
  <div class="pillar" id="pR">
    <div class="pidx"></div>
    <div class="pname"></div>
    <div class="pline"></div>
    <svg class="pglyph" viewBox="0 0 660 190"></svg>
    <div class="ptag"></div>
  </div>
</div>

<script>
/* ===== CONST DATA：本页全部文案/节拍（改这里） ===== */
const DATA = {
  N: 155,                                      // 总帧数（30fps）；尾延定格=只加大 N，节拍帧零改动
  title: "两个角度",                            // 顶标逐字（＝口播句关键词）
  sub: "PART 1 · A &nbsp;/&nbsp; PART 2 · B",
  /* 节拍帧（页内帧）：F_TITLE 顶标起；F_L1/F_L2 两卡点亮帧（★对准口播词首，词位估算须标依据） */
  F_TITLE: 3, F_L1: 58, F_L2: 81, LIT_D: 12,
  pillars: [                                   // 两卡：idx 索引 / name 大字 / tag 底部标注 / glyph 内联 SVG
    { id: "pL", enter: 6,   ph: 0,
      idx: "PART 1", name: "怎么用", tag: "U1-U3 · 实操与安装",
      /* 词位依据例：F_L1=58 ↔ 口播「怎么用」词首估算（asr 句级、无词级时间戳，待视觉抽验） */
      glyph: `
      <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round">
        <rect x="118" y="22" width="44" height="80" rx="22"/>
        <path d="M96 78a44 44 0 0 0 88 0M140 122v18M116 152h48"/>
      </g>
      <circle cx="238" cy="62" r="6" fill="#d97706"/>
      <circle cx="262" cy="62" r="6" fill="#d97706" opacity=".7"/>
      <circle cx="286" cy="62" r="6" fill="#d97706" opacity=".4"/>
      <g stroke="#1a1a1a" stroke-width="3.5" fill="none">
        <rect x="352" y="28" width="200" height="104" rx="12"/>
        <line x1="352" y1="64" x2="552" y2="64"/>
        <line x1="352" y1="98" x2="552" y2="98"/>
      </g>
      <g fill="#d97706">
        <circle cx="382" cy="46" r="6"/><circle cx="412" cy="46" r="6"/><circle cx="442" cy="46" r="6"/>
        <circle cx="472" cy="46" r="6"/><circle cx="502" cy="46" r="6"/>
        <circle cx="382" cy="81" r="6"/><circle cx="412" cy="81" r="6"/><circle cx="442" cy="81" r="6"/>
        <circle cx="472" cy="81" r="6"/><circle cx="502" cy="81" r="6"/>
      </g>
      <rect x="380" y="110" width="144" height="10" rx="5" fill="#1a1a1a"/>` },
    { id: "pR", enter: 8.4, ph: 1.2,
      idx: "PART 2", name: "怎么做", tag: "B1-B3 · 结构与实现",
      glyph: `
      <g stroke="#1a1a1a" stroke-width="3.5" fill="#ffffff">
        <rect x="96" y="26" width="150" height="40" rx="8"/>
        <rect x="96" y="74" width="150" height="40" rx="8" stroke="#d97706"/>
        <rect x="96" y="122" width="150" height="40" rx="8"/>
      </g>
      <rect x="160" y="68" width="22" height="8" rx="4" fill="#d97706"/>
      <rect x="160" y="116" width="22" height="8" rx="4" fill="#d97706"/>
      <g stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M356 42 L316 89 L356 136"/>
        <path d="M548 42 L588 89 L548 136"/>
      </g>
      <g stroke="#d97706" stroke-width="5" stroke-linecap="round">
        <line x1="408" y1="59" x2="528" y2="59"/>
        <line x1="408" y1="89" x2="498" y2="89"/>
        <line x1="408" y1="119" x2="528" y2="119"/>
      </g>` },
  ],
};

/* ===== 帧驱动协议（D8：URL ?f= 帧号 + 纯函数渲染；D24：30fps） ===== */
const FPS = 30, N = DATA.N;
const f = Math.min(parseInt(new URLSearchParams(location.search).get("f") || "0"), N - 1);
const t = f / FPS;

/* ---- 工具函数（_tokens.md 标准件 + rgb 数组插值） ---- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const sg   = (x, a, b) => clamp01((x - a) / (b - a));   // 帧域线性段
const eoc  = x => 1 - Math.pow(1 - x, 3);
const eob  = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix  = (a, b, m) => Math.round(a + (b - a) * m);
const rgb  = (a, b, m) => `rgb(${mix(a[0],b[0],m)},${mix(a[1],b[1],m)},${mix(a[2],b[2],m)})`;

/* gfx-full 无下层：全局 opacity 恒 1，交界硬切（D14/D21） */
document.body.style.opacity = 1;

const $ = id => document.getElementById(id);

/* ---- 文案注入 ---- */
$("sub").innerHTML = DATA.sub;
DATA.pillars.forEach(p => {
  const el = $(p.id);
  el.querySelector(".pidx").textContent = p.idx;
  el.querySelector(".pname").textContent = p.name;
  el.querySelector(".ptag").textContent = p.tag;
  el.querySelector(".pglyph").innerHTML = p.glyph;
});

/* ---- 顶标逐字弹入 ---- */
[...DATA.title].forEach((c, i) => {
  const s = document.createElement("span"); s.className = "ch"; s.textContent = c;
  const p = eoc(sg(f, DATA.F_TITLE + i * 3.5, DATA.F_TITLE + i * 3.5 + 13));
  s.style.opacity = p;
  s.style.transform = `translateY(${(1 - p) * 100}%) rotate(${(1 - p) * 4}deg)`;
  $("title").appendChild(s);
});
$("underline").style.opacity = clamp01(sg(f, 12, 24));
$("underline").style.transform = `scaleX(${eoc(sg(f, 12, 27))})`;
$("sub").style.opacity = eoc(sg(f, 16, 28));

/* ---- 两支柱卡：暗态弹入在位 → 口播词拍「点亮」→ 双亮定格 ----
   暗态=浅边灰字（信息在位不抢注意）；点亮=琥珀边+浅琥珀底+微辉光+琥珀横线生长+轻微上浮 */
const C = {
  border0: [204, 204, 204],   border1: [217, 119, 6],
  bg0: [255, 255, 255],       bg1: [252, 244, 234],
  name0: [168, 162, 158],     name1: [26, 26, 26],
  idx0: [214, 207, 194],      idx1: [180, 83, 9],
  tag0: [156, 163, 175],      tag1: [107, 114, 128]
};
function pillar(id, enterF, litF, ph) {
  const el = $(id);
  const ent = eob(sg(f, enterF, enterF + 16.5));            // 入场（暗态）
  const lit = eoc(sg(f, litF, litF + DATA.LIT_D));          // 点亮（词拍）
  el.style.opacity = clamp01(sg(f, enterF, enterF + 9) * 1.4);
  const lift = lit * 6, pulse = Math.sin(Math.PI * lit) * 0.015;
  el.style.transform = `translateY(${((1 - ent) * 46 - lift).toFixed(2)}px) scale(${((.6 + .4 * ent) * (1 + pulse)).toFixed(4)})`;
  el.style.borderColor = rgb(C.border0, C.border1, lit);
  el.style.background = rgb(C.bg0, C.bg1, lit);
  const glow = lit > 0 ? `0 0 ${(20 + 8 * Math.sin(t * 1.3 + ph)).toFixed(1)}px rgba(217,119,6,${(.20 * lit).toFixed(3)})` : "";
  el.style.boxShadow = `0 6px 22px rgba(26,26,26,.08)${glow ? "," + glow : ""}`;
  const pn = el.querySelector(".pname");  pn.style.color = rgb(C.name0, C.name1, lit);
  const px = el.querySelector(".pidx");   px.style.color = rgb(C.idx0, C.idx1, lit);
  const tg = el.querySelector(".ptag");
  tg.style.color = rgb(C.tag0, C.tag1, lit);
  tg.style.opacity = (0.55 + 0.45 * lit).toFixed(3);
  el.querySelector(".pglyph").style.opacity = (0.45 + 0.55 * lit).toFixed(3);
  el.querySelector(".pline").style.transform = `scaleX(${eoc(sg(f, litF, litF + 10)).toFixed(4)})`;
}
pillar(DATA.pillars[0].id, DATA.pillars[0].enter, DATA.F_L1, DATA.pillars[0].ph);
pillar(DATA.pillars[1].id, DATA.pillars[1].enter, DATA.F_L2, DATA.pillars[1].ph);
</script>
</body>
</html>
