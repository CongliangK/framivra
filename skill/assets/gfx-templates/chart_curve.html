<!doctype html><html><head><meta charset="utf-8"><title>模板 · 实测曲线图表页（gfx-full · 白底 · D22）</title><style>
/* ===== 模板：实测曲线图表页 =====
 * 用途：gfx-full 整页实测数据曲线——标题逐字 + 网格/黑轴线 + 琥珀曲线按「讲述节奏」生长 +
 *   曲线头光点实时读数 + 阶段竖虚线分隔 + 阶段标签 + callout 标注框 + 右下实测小表。
 * 来源：voice-ime g4c_vram.html（D22-③ 用户点名有价值的图表形态；曲线 KV/TP 机制为该页原创）。
 * 改哪里：只改 CONST DATA（标题/量纲/KV 关键帧/TP 讲述节奏/阶段标签/callout/小表）；机制代码勿动。
 * 机制要点：KV=[进度x,数值v] 分段线性插值出曲线；TP=[页内秒,进度x] 把「口播讲述时间→画图进度」
 *   参数化——节拍=讲述到哪画到哪；同页时间压缩复用=TP 全表×系数（voice-ime c3_perf 实案 ×0.75）。
 * 红线：D22 白底黑轴琥珀曲线零蓝；gfx-full 无下层禁全局淡入淡出（opacity 恒 1，交界硬切 D14）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;
  font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:#ffffff}   /* gfx-full 无下层 → 瞬显无淡入 */
#titlewrap{position:absolute;top:76px;left:0;width:100%;text-align:center;overflow:hidden;padding:0 40px}
#title{font-size:50px;font-weight:800;letter-spacing:5px;display:inline-block;white-space:nowrap}
#title .ch{display:inline-block;opacity:0;color:#1a1a1a}
#underline{position:absolute;top:158px;left:50%;height:4px;width:560px;margin-left:-280px;border-radius:2px;
  background:#d97706;opacity:0}
#sub{position:absolute;top:180px;width:100%;text-align:center;color:#6b7280;
  font-size:21px;letter-spacing:8px;opacity:0;white-space:nowrap}
#plot{position:absolute;left:0;top:0}
.plabel{position:absolute;top:912px;width:270px;margin-left:-135px;text-align:center;opacity:0}
.plabel .pn{font-size:22px;font-weight:800;color:#1a1a1a;letter-spacing:1px;white-space:nowrap}
.plabel .pn b{font-weight:800;color:#d97706}
.plabel .pv{margin-top:6px;font-size:21px;font-weight:800;color:#b45309;letter-spacing:1px;white-space:nowrap}
.plabel .ps{margin-top:5px;font-size:16px;font-weight:600;color:#9ca3af;white-space:nowrap}
#callout{position:absolute;left:470px;top:316px;width:480px;border-radius:14px;opacity:0;
  background:#f5f5f4;border:1.5px dashed #a8a29e;
  padding:13px 20px;box-shadow:0 8px 24px rgba(26,26,26,.08)}
#callout .c1{font-size:23px;font-weight:800;color:#1a1a1a;letter-spacing:1px;white-space:nowrap}
#callout .c1 b{color:#b45309}
#callout .c2{margin-top:6px;font-size:17px;color:#6b7280;letter-spacing:1px;white-space:nowrap}
#headval{position:absolute;transform:translate(-50%,-100%);font-size:25px;font-weight:800;color:#1a1a1a;
  background:#ffffff;border:1.5px solid rgba(217,119,6,.65);border-radius:10px;
  padding:6px 16px;white-space:nowrap;opacity:0;text-align:center;
  box-shadow:0 6px 18px rgba(26,26,26,.08)}
#tbl{position:absolute;left:1566px;top:598px;width:300px;border-radius:14px;opacity:0;
  background:#ffffff;border:1.5px solid #a8a29e;
  box-shadow:0 8px 26px rgba(26,26,26,.10);padding:18px 24px}
#tbl .th{font-size:18px;font-weight:800;color:#6b7280;letter-spacing:4px;margin-bottom:10px}
#tbl .tr{display:flex;justify-content:space-between;align-items:baseline;height:42px}
#tbl .tl{font-size:22px;font-weight:600;color:#3f3f46}
#tbl .tv{font-size:27px;font-weight:800;color:#b45309}
#tbl .tf{margin-top:8px;font-size:15px;color:#9ca3af;letter-spacing:1px}
#xname{position:absolute;left:1700px;top:830px;font-size:18px;color:#9ca3af;letter-spacing:2px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="bg"></div>
  <div id="titlewrap"><div id="title"></div></div>
  <div id="underline"></div>
  <div id="sub"></div>
  <svg id="plot" width="1920" height="1080"></svg>
  <div id="callout"><div class="c1" id="co1"></div><div class="c2" id="co2"></div></div>
  <div id="headval"></div>
  <div id="tbl"><div class="th" id="tblh"></div><div id="tblrows"></div><div class="tf" id="tblf"></div></div>
  <div id="xname"></div>
</div>
<script>
/* ===== CONST DATA：本页全部文案与数据（改这里） ===== */
const DATA = {
  title: "曲线标题 · 换成你的",              // 页眉逐字
  sub:   "CURVE TEMPLATE · 实测环境戳（设备 · 日期）",  // 副行：建议带实测环境戳
  N: 600,                                    // 总帧数（30fps）
  unit: "GB",                                // 纵轴量纲（刻度 1..VMAX 自动生成）
  VMAX: 5,                                   // 纵轴满量程
  xname: "时间（示意）→",
  headFmt: v => v.toFixed(1) + " " + DATA.unit,  // 曲线头读数格式
  /* KV：曲线关键帧 [横向进度 0..1, 数值 v]——分段线性，多段平台/跳变都靠关键帧表达 */
  KV: [[0,0],[.02,0],[.10,4.2],[.40,4.2],[.45,2.1],[.60,2.1],[.645,.3],[.78,.3],[.797,4.2],[.97,4.2]],
  /* TP：讲述时间→画图进度 [页内秒, 进度x]——★节拍核心：讲述到哪、曲线画到哪；
     同页压缩复用＝全表秒值 ×系数（voice-ime c3_perf 实案 ×0.75） */
  TP: [[1.6,0],[3.0,.10],[3.3,.17],[3.9,.17],[6.1,.40],[6.5,.40],[9.3,.60],[9.7,.60],
       [12.5,.78],[12.9,.78],[13.2,.797],[14.7,.965],[15.4,.97],[999,.97]],
  /* 阶段：分隔虚线 SEP=[进度x, 出现秒]；标签 STG=[中心进度c, 点亮秒, 名(可含<b>编号), 值, 小字] */
  SEP: [[.17,3.9],[.40,6.5],[.60,9.7],[.78,12.9]],
  STG: [
    {c:.085,a:2.8, n:'<b>①</b> 阶段一',        v:'4.2 GB',            s:''},
    {c:.285,a:3.9, n:'<b>②</b> 阶段二',        v:'外部事件 · 曲线外',  s:''},
    {c:.50, a:6.6, n:'<b>③</b> 阶段三',        v:'2.1 GB',            s:'备注小字（可空）'},
    {c:.69, a:9.8, n:'<b>④</b> 阶段四',        v:'≈0.3 GB',           s:''},
    {c:.875,a:13.3,n:'<b>⑤</b> 阶段五',        v:'0.4s 回升',         s:''}],
  /* callout 标注框（阶段②入场/⑤前退场窗口可改机制区两个 seg 常量） */
  callout: { c1: '标注主行 · 关键量 <b>&lt; 5GiB</b>', c2: '标注副行 —— 补充因果说明',
             in: [3.9, 4.5], out: [12.1, 12.6] },
  /* 唤醒脉冲环（一次扩散）：[进度x, 数值, 起秒, 窗宽]；null 关闭 */
  pulse: { x: .797, v: 4.2, a: 13.15, dur: 1.0 },
  /* 右下实测小表 */
  table: { h: '实测', rows: [['项目甲','4.2 GB'],['项目乙','2.1 GB'],['项目丙','0.4 s']],
           foot: '脚注小字（残量/口径说明）' },
  /* 曲线头读数翻面窗口（callout 在场且头进入其 x 区间时读数翻到曲线下方避遮挡） */
  headFlip: t => t > 3.9 && t < 12.4,
};

/* ===== 帧驱动协议（D8；D24：30fps；同 f 同像素） ===== */
const FPS=30,N=DATA.N,f=parseInt(new URLSearchParams(location.search).get("f")||"0"),t=Math.min(f/FPS,N/FPS);
const clamp01=v=>Math.max(0,Math.min(1,v)),seg=(t,a,b)=>clamp01((t-a)/(b-a));
const eoc=x=>1-Math.pow(1-x,3),eob=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

/* gfx-full 无下层：全局 opacity 恒 1，交界硬切（D14/D21） */
document.body.style.opacity=1;

/* —— 文案注入 —— */
document.getElementById("sub").textContent=DATA.sub;
document.getElementById("co1").innerHTML=DATA.callout.c1;
document.getElementById("co2").textContent=DATA.callout.c2;
document.getElementById("tblh").textContent=DATA.table.h;
document.getElementById("tblf").textContent=DATA.table.foot;
document.getElementById("xname").textContent=DATA.xname;
DATA.table.rows.forEach(r=>{
  const d=document.createElement("div");d.className="tr";
  d.innerHTML=`<span class="tl">${r[0]}</span><span class="tv">${r[1]}</span>`;
  document.getElementById("tblrows").appendChild(d);});

/* —— 标题逐字 —— */
const titleEl=document.getElementById("title");
[...DATA.title].forEach((c,i)=>{const s=document.createElement("span");s.className="ch";s.textContent=c;
  const p=eoc(seg(t,.12+i*.05,.85+i*.05));
  s.style.opacity=p;s.style.transform=`translateY(${(1-p)*110}%)`;titleEl.appendChild(s);});
document.getElementById("underline").style.opacity=eoc(seg(t,.75,1.4));
document.getElementById("sub").style.opacity=eoc(seg(t,.85,1.45));

/* —— 图表几何：plot 区域 x[210,1730] y[330,860]，纵轴 0..VMAX —— */
const PL={x0:210,x1:1730,y0:330,y1:860},VMAX=DATA.VMAX;
const X=v=>PL.x0+(PL.x1-PL.x0)*v, Y=v=>PL.y1-(PL.y1-PL.y0)*(v/VMAX);
const svg=document.getElementById("plot"),NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};

/* 网格线（灰虚线）+ 纵轴刻度 + 黑轴线（随图入场逐条亮） */
const gridG=[];
for(let g=1;g<=VMAX;g++){gridG.push(el("line",{x1:PL.x0,y1:Y(g),x2:PL.x1,y2:Y(g),
  stroke:"rgba(107,114,128,.25)","stroke-width":1,"stroke-dasharray":"2 10"}));
  const tx=el("text",{x:PL.x0-16,y:Y(g)+7,"text-anchor":"end",fill:"#6b7280",
    "font-size":"20","font-family":"Noto Sans CJK SC"});tx.textContent=g;gridG.push(tx);}
const gby=el("text",{x:PL.x0-16,y:Y(VMAX)-26,"text-anchor":"end",fill:"#9ca3af",
  "font-size":"19","font-family":"Noto Sans CJK SC"});gby.textContent=DATA.unit;gridG.push(gby);
gridG.push(el("line",{x1:PL.x0,y1:PL.y1,x2:PL.x1,y2:PL.y1,stroke:"#1a1a1a","stroke-width":2.5}));
gridG.push(el("line",{x1:PL.x0,y1:PL.y1,x2:PL.x0,y2:PL.y0,stroke:"#1a1a1a","stroke-width":2.5}));
const gA=eoc(seg(t,.7,1.5));gridG.forEach(g=>g.style.opacity=gA);
document.getElementById("xname").style.opacity=eoc(seg(t,1.1,1.6));

/* 曲线：KV 分段线性 */
const KV=DATA.KV;
function vAt(x){for(let i=0;i<KV.length-1;i++){const[a,va]=KV[i],[b,vb]=KV[i+1];
  if(x<=b)return vb===va?va:va+(vb-va)*((x-a)/(b-a));}return KV[KV.length-1][1];}

/* 讲述时间→曲线头进度：TP 分段线性（节拍=讲述节奏驱动画图） */
const TP=DATA.TP;
function xAt(t){if(t<=TP[0][0])return TP[0][1];
  for(let i=0;i<TP.length-1;i++){const[ta,xa]=TP[i],[tb,xb]=TP[i+1];
    if(t<tb)return xa+(xb-xa)*((t-ta)/(tb-ta));}return TP[TP.length-1][1];}
const hx=xAt(t);

/* polyline 截断：按进度截断 points；曲线=琥珀粗线+浅琥珀面积（终态进度=TP 末值） */
const XEND=TP[TP.length-1][1]||.97;
const area=el("polygon",{fill:"rgba(217,119,6,.06)"});
const line=el("polyline",{fill:"none",stroke:"#d97706","stroke-width":6,"stroke-linejoin":"round","stroke-linecap":"round"});
const SAMPLES=360;
{
  let sp="",sa="";
  const n=Math.floor(SAMPLES*Math.min(hx,XEND)/XEND);
  for(let i=0;i<=n;i++){const x=(i/SAMPLES)*XEND,px=X(x),py=Y(vAt(x));
    sp+=px+","+py+" ";if(i===0)sa+=px+","+PL.y1+" ";sa+=px+","+py+" ";}
  if(n>=0){sa+=X((n/SAMPLES)*XEND)+","+PL.y1;}
  line.setAttribute("points",sp);area.setAttribute("points",sa);
}

/* 曲线头：琥珀光点 + 实时读数（callout 在场且头入其 x 区间→读数翻到曲线下方） */
const headX=X(Math.min(hx,XEND)),headV=vAt(Math.min(hx,XEND)),headY=Y(headV);
const ring=el("circle",{cx:headX,cy:headY,r:13,fill:"none",stroke:"#d97706","stroke-width":2.5,opacity:0});
const dot=el("circle",{cx:headX,cy:headY,r:8,fill:"#d97706",stroke:"#ffffff","stroke-width":2.5});
const hv=document.getElementById("headval");
hv.style.opacity=clamp01(seg(t,1.8,2.2));
const coLive=DATA.headFlip(t)&&headX>430&&headX<990;
hv.style.left=headX+"px";
hv.style.top=coLive?(headY+16)+"px":(headY-26)+"px";
hv.style.transform=coLive?"translate(-50%,0)":"translate(-50%,-100%)";
hv.textContent=DATA.headFmt(headV);

/* 阶段竖虚线分隔（灰，进入该阶段时亮） */
DATA.SEP.forEach(([sx,st])=>{const l=el("line",{x1:X(sx),y1:PL.y0+8,x2:X(sx),y2:PL.y1-6,
  stroke:"rgba(156,163,175,.6)","stroke-width":2,"stroke-dasharray":"8 10",opacity:0});
  l.style.opacity=.85*eoc(seg(t,st,st+.5));});

/* 阶段标签（曲线头到达该区域时点亮；编号统一琥珀） */
DATA.STG.forEach((st,i)=>{
  const d=document.createElement("div");d.className="plabel";d.id="pl"+i;
  d.style.left=X(st.c)+"px";
  d.innerHTML=`<div class="pn">${st.n}</div><div class="pv">${st.v}</div>`+
    (st.s?`<div class="ps">${st.s}</div>`:"");
  document.getElementById("stage").appendChild(d);
  const p=eoc(seg(t,st.a,st.a+.6));
  d.style.opacity=p;d.style.transform=`translateY(${(1-p)*16}px)`;});

/* callout 标注框：入场/退场窗口（DATA.callout.in/out） */
const co=document.getElementById("callout");
const coIn=eob(seg(t,DATA.callout.in[0],DATA.callout.in[1])),coOut=seg(t,DATA.callout.out[0],DATA.callout.out[1]);
co.style.opacity=clamp01(seg(t,DATA.callout.in[0],DATA.callout.in[0]+.35))*(1-coOut);
co.style.transform=`translateY(${(1-coIn)*-26}px)`;

/* 唤醒脉冲环（曲线头到达脉冲点时一次扩散，琥珀） */
if(DATA.pulse){
  const wp=seg(t,DATA.pulse.a,DATA.pulse.a+DATA.pulse.dur);
  ring.setAttribute("cx",X(DATA.pulse.x));ring.setAttribute("cy",Y(DATA.pulse.v));
  ring.setAttribute("r",14+66*wp);
  ring.style.opacity=(1-wp)*.75*clamp01(seg(t,DATA.pulse.a-.05,DATA.pulse.a+.15));
  ring.setAttribute("stroke","#d97706");
}

/* 右下实测小表（收尾） */
const tbl=document.getElementById("tbl");
tbl.style.opacity=clamp01(seg(t,15.0,15.35));
tbl.style.transform=`scale(${.9+.1*eob(seg(t,15.0,15.6))})`;
</script></body></html>
