<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;font-family:"Noto Sans CJK SC",sans-serif;overflow:hidden}
/* 下三分之一条 */
#lt{position:absolute;left:0;bottom:190px;width:820px;height:120px;
  background:linear-gradient(90deg,rgba(8,47,73,.92),rgba(8,47,73,.55) 75%,transparent);
  border-left:10px solid #22d3ee;transform-origin:left;transform:scaleX(0)}
#lt .n{position:absolute;left:44px;top:20px;font-size:42px;font-weight:900;color:#f1f5f9}
#lt .d{position:absolute;left:46px;top:74px;font-size:22px;color:#7dd3fc;letter-spacing:2px}
/* 端板 */
#end{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:right}
#end .l1{font-size:110px;font-weight:900;color:#f1f5f9;letter-spacing:4px;
  text-shadow:0 0 80px rgba(167,139,250,.35)}
#end .l2{font-size:34px;color:#94a3b8;letter-spacing:12px;margin-top:16px}
#end .ok{display:inline-block;margin-top:26px;padding:10px 34px;border-radius:999px;
  border:2px solid #34d399;color:#34d399;font-size:30px;font-weight:700;letter-spacing:6px}
/* 角标雷达线 */
#line{position:absolute;inset:0}
</style></head><body>
<svg id="line" width="1920" height="1080"></svg>
<div id="lt"><div class="n">精确剪辑 · 数据驱动</div><div class="d">TIMELINE.JSON → FFMPEG · FRAME EXACT</div></div>
<div id="end">
  <div class="l1">POC-2</div>
  <div class="l2">ALL FEATURES VERIFIED</div>
  <div class="ok">✓ 720 FRAMES</div>
</div>
<script>
const FPS=24,N=168,f=parseInt(new URLSearchParams(location.search).get("f")||"0"),t=Math.min(f/FPS,N/FPS);
const clamp01=v=>Math.max(0,Math.min(1,v)),seg=(t,a,b)=>clamp01((t-a)/(b-a));
const eoc=x=>1-Math.pow(1-x,3),eoe=x=>x>=1?1:1-Math.pow(2,-10*x),eob=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

/* 下三分之一条：0.2s 入，5.0s 出 */
const lp=eoc(seg(t,.2,1.0));
const lt=document.getElementById("lt");
lt.style.transform=`scaleX(${lp})`;
lt.style.opacity=clamp01(seg(t,.2,.5))*(1-seg(t,4.6,5.1));
lt.querySelector(".n").style.transform=`translateX(${(1-lp)*-60}px)`;
lt.querySelector(".d").style.opacity=clamp01(seg(t,.6,1.1));

/* 扫描线：横贯画面 */
const sp=((t*.35)%1);
document.getElementById("line").innerHTML=
 `<line x1="${sp*1920}" y1="0" x2="${sp*1920}" y2="1080" stroke="rgba(103,232,249,.35)" stroke-width="2"/>
  <circle cx="${sp*1920}" cy="540" r="8" fill="#67e8f9" opacity=".8"/>`;

/* 端板：2.2s 起 */
const ep=eob(seg(t,2.2,2.9));
const end=document.getElementById("end");
end.style.opacity=clamp01(seg(t,2.2,2.5));
end.style.transform=`translate(-50%,-50%) scale(${.8+.2*ep})`;
const okp=eob(seg(t,2.9,3.4));
const ok=end.querySelector(".ok");
ok.style.opacity=clamp01(okp);
ok.style.transform=`scale(${.5+.5*okp})`;
/* 数字滚动 0→720 */
const n=Math.round(720*eoc(seg(t,2.6,4.2)));
ok.textContent=`✓ ${n} FRAMES`;
/* 呼吸 */
end.style.filter=`drop-shadow(0 0 ${20+10*Math.sin(t*3)}px rgba(167,139,250,.3))`;

/* 整体淡出（ gfxC in=528 out=696 → 7s 长） */
document.body.style.opacity=1-clamp01(seg(t,6.55,6.95));
</script></body></html>
